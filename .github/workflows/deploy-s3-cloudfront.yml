name: Reusable S3+CloudFront Deployment Workflow

on:
  workflow_call:
    inputs:
      app_name:
        description: "App name (e.g., 'admin-app')"
        required: true
        type: string
      app_display_name:
        description: "Display name for the app"
        required: false
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "eu-west-2"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      build_command:
        description: "Build command"
        required: false
        type: string
        default: "npm run build"
      build_output_dir:
        description: "Build output directory (Vite: dist, CRA: build)"
        required: false
        type: string
        default: "dist"
      main_branch:
        description: "Main/production branch name"
        required: false
        type: string
        default: "main"
      staging_branch:
        description: "Staging branch name"
        required: false
        type: string
        default: "stage"
      dev_branch:
        description: "Dev branch name"
        required: false
        type: string
        default: "dev"
      environment:
        description: "Environment override (for workflow_dispatch) - optional"
        required: false
        type: string
      branch:
        description: "Branch override (for workflow_dispatch) - optional"
        required: false
        type: string
      invalidate_distribution_tenants:
        description: "Also invalidate the per-tenant caches of a CloudFront multi-tenant distribution (requires CF_TENANT_DISTRIBUTION_ID)"
        required: false
        type: boolean
        default: false
    secrets:
      S3_BUCKET_NAME:
        description: "S3 bucket name (per-environment)"
        required: false
      CF_DISTRIBUTION_ID:
        description: "CloudFront distribution ID (per-environment)"
        required: false
      CF_TENANT_DISTRIBUTION_ID:
        description: "CloudFront multi-tenant (tenant-only) distribution ID whose tenants also serve this bucket (per-environment)"
        required: false
      BUILD_ENV_VARS:
        description: "Environment-specific build-time env vars (KEY=value, newline-separated)"
        required: false
      AWS_ROLE_TO_ASSUME_PROD:
        description: "AWS IAM role ARN for production"
        required: false
      AWS_ROLE_TO_ASSUME_STAGING:
        description: "AWS IAM role ARN for staging"
        required: false
      AWS_ROLE_TO_ASSUME_DEV:
        description: "AWS IAM role ARN for dev"
        required: false
      SLACK_WEBHOOK_URL_PROD:
        description: "Slack webhook for production notifications"
        required: false
      SLACK_WEBHOOK_URL_STAGING:
        description: "Slack webhook for staging notifications"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      branch: ${{ steps.set-env.outputs.branch }}
      aws_region: ${{ steps.set-env.outputs.aws_region }}
      version: ${{ steps.version-check.outputs.version }}
      is_release: ${{ steps.version-check.outputs.is_release }}
      has_tag: ${{ steps.version-check.outputs.has_tag }}
    steps:
      - name: Set environment variables
        id: set-env
        run: |
          # Determine environment and branch based on trigger
          if [[ -n "${{ inputs.environment }}" ]]; then
            ENV="${{ inputs.environment }}"
            if [[ -n "${{ inputs.branch }}" ]]; then
              BRANCH="${{ inputs.branch }}"
            else
              BRANCH="${{ github.ref_name }}"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/${{ inputs.main_branch }}" ]]; then
            ENV="production"
            BRANCH="${{ inputs.main_branch }}"
          elif [[ "${{ github.ref }}" == "refs/heads/${{ inputs.staging_branch }}" ]]; then
            ENV="staging"
            BRANCH="${{ inputs.staging_branch }}"
          elif [[ "${{ github.ref }}" == "refs/heads/${{ inputs.dev_branch }}" ]]; then
            ENV="dev"
            BRANCH="${{ inputs.dev_branch }}"
          else
            echo "Error: Unexpected branch ${{ github.ref }}"
            exit 1
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "aws_region=${{ inputs.aws_region }}" >> $GITHUB_OUTPUT

      - name: Checkout code for version check
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.set-env.outputs.branch }}

      - name: Check version and tags
        id: version-check
        run: |
          # Get version from package.json if it exists
          if [ -f "package.json" ]; then
            VERSION=$(grep '"version"' package.json | sed -E 's/.*"version":\s*"([^"]*)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Version: $VERSION"

            # Check if this is a release (commit message contains version bump)
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MESSAGE" =~ "chore: bump version to" ]] || [[ "$COMMIT_MESSAGE" =~ "chore: release version" ]]; then
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "🎉 This is a release deployment"

              # For release deployments to production, wait for tag (REQUIRED)
              if [[ "${{ steps.set-env.outputs.environment }}" == "production" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
                echo "⏳ Waiting for tag v$VERSION..."
                TAG_FOUND=false
                for i in {1..10}; do
                  git fetch --tags
                  if git rev-parse "v$VERSION" >/dev/null 2>&1; then
                    echo "✅ Tag v$VERSION found!"
                    echo "has_tag=true" >> $GITHUB_OUTPUT
                    TAG_FOUND=true
                    break
                  fi
                  echo "Waiting for tag... ($i/10)"
                  sleep 3
                done

                if [ "$TAG_FOUND" = false ]; then
                  echo "❌ ERROR: Tag v$VERSION was not created after 30 seconds!"
                  echo "Deployment cannot proceed without a proper tag for production releases."
                  exit 1
                fi
              else
                git fetch --tags
                if git rev-parse "v$VERSION" >/dev/null 2>&1; then
                  echo "has_tag=true" >> $GITHUB_OUTPUT
                else
                  echo "has_tag=false" >> $GITHUB_OUTPUT
                fi
              fi
            else
              echo "is_release=false" >> $GITHUB_OUTPUT
              git fetch --tags
              if git rev-parse "v$VERSION" >/dev/null 2>&1; then
                echo "has_tag=true" >> $GITHUB_OUTPUT
              else
                echo "has_tag=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "has_tag=false" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build and Deploy to ${{ needs.setup.outputs.environment }}
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set build environment variables
        env:
          BUILD_ENV_VARS: ${{ secrets.BUILD_ENV_VARS }}
        run: |
          # Parse BUILD_ENV_VARS secret (KEY=value, newline-separated)
          echo "$BUILD_ENV_VARS" | while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done

      - name: Build application
        run: ${{ inputs.build_command }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.setup.outputs.environment == 'production' && secrets.AWS_ROLE_TO_ASSUME_PROD || needs.setup.outputs.environment == 'dev' && (secrets.AWS_ROLE_TO_ASSUME_DEV || secrets.AWS_ROLE_TO_ASSUME_STAGING) || secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ needs.setup.outputs.aws_region }}

      - name: Preflight tenant invalidation config
        if: ${{ inputs.invalidate_distribution_tenants }}
        env:
          TENANT_DISTRIBUTION_ID: ${{ secrets.CF_TENANT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          # Checked BEFORE the S3 upload: a misconfigured secret or an AWS CLI
          # without the tenant subcommand should fail the deploy while it is
          # still a no-op, rather than after objects are already live with
          # tenant caches left stale.
          if [[ -z "${TENANT_DISTRIBUTION_ID}" ]]; then
            echo "❌ invalidate_distribution_tenants is true but CF_TENANT_DISTRIBUTION_ID is not set for this environment."
            exit 1
          fi

          if ! aws cloudfront create-invalidation-for-distribution-tenant help >/dev/null 2>&1; then
            echo "❌ This runner's AWS CLI has no create-invalidation-for-distribution-tenant."
            aws --version
            exit 1
          fi

          echo "✅ Tenant invalidation preflight passed for ${TENANT_DISTRIBUTION_ID}"

      - name: Deploy to S3
        run: |
          echo "🚀 Syncing ${{ inputs.build_output_dir }}/ to s3://${{ secrets.S3_BUCKET_NAME }}/"
          aws s3 sync ./${{ inputs.build_output_dir }} s3://${{ secrets.S3_BUCKET_NAME }}/ --delete

      - name: Set cache headers on index.html
        run: |
          echo "📄 Setting no-cache headers on index.html"
          aws s3 cp \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            ./${{ inputs.build_output_dir }}/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html

      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront distribution ${{ secrets.CF_DISTRIBUTION_ID }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✅ Invalidation created: $INVALIDATION_ID"

      - name: Invalidate CloudFront tenant caches
        if: ${{ inputs.invalidate_distribution_tenants }}
        env:
          TENANT_DISTRIBUTION_ID: ${{ secrets.CF_TENANT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          # Config and CLI capability were already validated by the preflight
          # step before the S3 upload; this re-check is a cheap guard only.
          if [[ -z "${TENANT_DISTRIBUTION_ID}" ]]; then
            echo "❌ CF_TENANT_DISTRIBUTION_ID is not set for this environment."
            exit 1
          fi

          # Per-tenant caches are separate namespaces from the direct
          # distribution's, so the invalidation above does not reach custom
          # domains served by the multi-tenant distribution.
          echo "🔎 Listing tenants of distribution ${TENANT_DISTRIBUTION_ID}"
          # Capture to a file rather than `mapfile < <(aws ...)`: process
          # substitution discards the aws exit status, so an API failure would
          # look identical to "no tenants" and silently pass the deploy.
          TENANT_LIST_FILE="$(mktemp)"
          if ! aws cloudfront list-distribution-tenants \
            --association-filter "DistributionId=${TENANT_DISTRIBUTION_ID}" \
            --query 'DistributionTenantList[].Id' \
            --output text > "${TENANT_LIST_FILE}"; then
            echo "❌ Failed to list tenants of ${TENANT_DISTRIBUTION_ID}."
            rm -f "${TENANT_LIST_FILE}"
            exit 1
          fi

          TENANT_IDS=()
          while read -r TENANT_ID; do
            [[ -n "${TENANT_ID}" ]] && TENANT_IDS+=("${TENANT_ID}")
          done < <(tr '\t' '\n' < "${TENANT_LIST_FILE}")
          rm -f "${TENANT_LIST_FILE}"

          if [[ ${#TENANT_IDS[@]} -eq 0 ]]; then
            echo "ℹ️  No tenants associated with ${TENANT_DISTRIBUTION_ID}; nothing to invalidate."
            exit 0
          fi

          echo "🔄 Invalidating ${#TENANT_IDS[@]} tenant cache(s)"
          FAILED=()
          for TENANT_ID in "${TENANT_IDS[@]}"; do
            # Unique CallerReference per tenant per run.
            BATCH="{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TENANT_ID}\"}"
            if INVALIDATION_ID=$(aws cloudfront create-invalidation-for-distribution-tenant \
              --id "${TENANT_ID}" \
              --invalidation-batch "${BATCH}" \
              --query 'Invalidation.Id' \
              --output text); then
              echo "  ✅ ${TENANT_ID} -> ${INVALIDATION_ID}"
            else
              echo "  ❌ ${TENANT_ID} failed"
              FAILED+=("${TENANT_ID}")
            fi
            # Stay well inside the invalidation request rate quota.
            sleep 1
          done

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "❌ Tenant invalidation failed for: ${FAILED[*]}"
            exit 1
          fi
          echo "✅ Tenant invalidation requests submitted (${#TENANT_IDS[@]}); edges refresh asynchronously"

      - name: Create deployment summary
        if: always()
        run: |
          DISPLAY_NAME="${{ inputs.app_display_name }}"
          if [[ -z "$DISPLAY_NAME" ]]; then
            DISPLAY_NAME="${{ inputs.app_name }}"
          fi

          echo "## 🚀 $DISPLAY_NAME Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.setup.outputs.version }}" != "unknown" ]]; then
            if [[ "${{ needs.setup.outputs.has_tag }}" == "true" ]]; then
              echo "- **Version:** v${{ needs.setup.outputs.version }} 🏷️" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ "${{ needs.setup.outputs.is_release }}" == "true" ]]; then
              echo "- **Type:** 🎉 Release Deployment" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Type:** Regular Deployment" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "- **Branch:** ${{ needs.setup.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** ${{ secrets.S3_BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** ${{ secrets.CF_DISTRIBUTION_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region:** ${{ needs.setup.outputs.aws_region }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ **${{ needs.setup.outputs.environment }} deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **${{ needs.setup.outputs.environment }} deployment failed!**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send deployment notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ${{ inputs.app_display_name || inputs.app_name }} Deployment: ${{ job.status }}
            Environment: ${{ needs.setup.outputs.environment }}
            ${{ needs.setup.outputs.version != 'unknown' && format('Version: {0}{1}', needs.setup.outputs.has_tag == 'true' && 'v' || '', needs.setup.outputs.version) || '' }} ${{ needs.setup.outputs.is_release == 'true' && '🎉' || '' }}
            Branch: ${{ needs.setup.outputs.branch }}
            Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ needs.setup.outputs.environment == 'production' && secrets.SLACK_WEBHOOK_URL_PROD || secrets.SLACK_WEBHOOK_URL_STAGING }}
