name: Reusable PR Preview Workflow

# Keeps a per-PR preview on stage in step with the PR:
#   https://<app>-pr-<N>.preview.servefirst.co.uk -> s3://preview.servefirst.co.uk/<app>/pr-<N>/
# The preview talks to the stage API and stage data. Caller wiring: docs/pr-previews.md.
#
# How it stays correct when runs arrive late, overlap or are dropped:
# - One run at a time per repo + PR + app (concurrency group, never cancelled), so no two
#   runs ever write the bucket or the comment at the same time.
# - A run does not blindly publish "its" build or delete "its" folder. Once it holds the
#   group it reads the PR's live state and makes the preview match it: PR closed -> remove;
#   PR open -> publish the build of the PR's CURRENT head commit, taking that build's
#   artifact from whichever run of the caller workflow built it. If that build isn't ready
#   yet, it changes nothing: that build's own run comes later and publishes it.
# - GitHub keeps only the newest pending run in a group and drops older pending ones. That is
#   safe here because every run reconciles to the live state, so the run that survives also
#   does the dropped run's work. Every push, close and reopen starts a run after the change,
#   so the last run to execute always sees the final state.

on:
  workflow_call:
    inputs:
      app_name:
        description: "Preview app: 'app' (sf-react-app) or 'admin' (sf-admin)"
        required: true
        type: string
      artifact_name:
        description: "Name of the build artifact (site root, index.html at the top) the caller's build job uploads"
        required: true
        type: string
      action:
        description: "'publish' (after a build) or 'cleanup' (PR closed); both reconcile to the PR's live state"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read

jobs:
  preview:
    name: PR preview ${{ inputs.action }} (${{ inputs.app_name }})
    # Fork PRs and anything but a pull_request event skip the job, so the deploy role is
    # never assumed for them (pull_request_target also carries a pull_request payload).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request != null &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Job level, not workflow level: inside a reusable workflow a workflow-level group shares
    # the caller's namespace. Never cancel a running writer (see the header).
    concurrency:
      group: pr-preview-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ inputs.app_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      PREVIEW_ACTION: ${{ inputs.action }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_SHA: ${{ github.event.pull_request.head.sha }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      AWS_ROLE: arn:aws:iam::068531097348:role/stage-github-actions-preview
      BUCKET: preview.servefirst.co.uk
      AWS_REGION_NAME: eu-west-2
      PREVIEW_ALIAS: "*.preview.servefirst.co.uk"
      SITE_DIR: preview-site
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate inputs
        id: vars
        run: |
          set -euo pipefail
          case "$APP_NAME" in
            app|admin) ;;
            *) echo "❌ app_name must be 'app' or 'admin', got '$APP_NAME'"; exit 1 ;;
          esac
          case "$PREVIEW_ACTION" in
            publish|cleanup) ;;
            *) echo "❌ action must be 'publish' or 'cleanup', got '$PREVIEW_ACTION'"; exit 1 ;;
          esac
          if [[ -z "$ARTIFACT_NAME" ]]; then
            echo "❌ artifact_name is required"
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "❌ Unexpected PR number '$PR_NUMBER'"
            exit 1
          fi
          {
            echo "prefix=${APP_NAME}/pr-${PR_NUMBER}"
            echo "url=https://${APP_NAME}-pr-${PR_NUMBER}.preview.servefirst.co.uk"
            echo "marker=<!-- pr-preview:${APP_NAME} -->"
          } >> "$GITHUB_OUTPUT"

      - name: Decide what the preview should be
        id: plan
        run: |
          set -euo pipefail
          # Read only now, while this run holds the group: no other run can change the
          # preview until this one ends, so this decision stays the right one for its writes.
          PR_INFO=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.state) \(.head.sha)"')
          read -r STATE LIVE_SHA <<< "$PR_INFO"
          if [[ "$STATE" != "open" ]]; then
            echo "🗑️  PR is ${STATE}: the preview should not exist."
            echo "mode=remove" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ Unexpected head sha '$LIVE_SHA'"; exit 1
          fi
          echo "target_sha=${LIVE_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$PREVIEW_ACTION" == "publish" && "$LIVE_SHA" == "$RUN_SHA" ]]; then
            echo "🚀 This run built the PR's head ${LIVE_SHA:0:7}."
            { echo "mode=publish"; echo "source_run=${GITHUB_RUN_ID}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The head is another commit: find the caller-workflow run that built it and still
          # has the artifact. The caller workflow file comes from github.workflow_ref
          # ("owner/repo/.github/workflows/x.yml@ref").
          WF_PATH="${CALLER_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          WF_PATH="${WF_PATH%%@*}"
          RUN_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${LIVE_SHA}&event=pull_request&per_page=50" \
            --jq "[.workflow_runs[] | select(.path == \"${WF_PATH}\")] | sort_by(.created_at) | reverse | .[].id")
          for RUN in $RUN_IDS; do
            HAS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?name=${ARTIFACT_NAME}" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [[ "$HAS" -gt 0 ]]; then
              echo "🚀 Publishing the PR's head ${LIVE_SHA:0:7}, built by run ${RUN}."
              { echo "mode=publish"; echo "source_run=${RUN}"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ℹ️  The PR's head ${LIVE_SHA:0:7} has no finished build yet; its own run will publish it."
          echo "mode=wait" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        if: ${{ steps.plan.outputs.mode == 'publish' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.SITE_DIR }}
          run-id: ${{ steps.plan.outputs.source_run }}
          github-token: ${{ github.token }}

      - name: Check build artifact
        if: ${{ steps.plan.outputs.mode == 'publish' }}
        run: |
          set -euo pipefail
          # Checked before the role is assumed: a wrong artifact should fail while nothing changed.
          if [[ ! -f "${SITE_DIR}/index.html" ]]; then
            echo "❌ Artifact '${ARTIFACT_NAME}' has no index.html at its root (upload the build dir's contents)."
            exit 1
          fi

      - name: Configure AWS credentials
        if: ${{ steps.plan.outputs.mode == 'publish' || steps.plan.outputs.mode == 'remove' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Find preview CloudFront distribution
        id: cdn
        if: ${{ steps.plan.outputs.mode == 'publish' || steps.plan.outputs.mode == 'remove' }}
        run: |
          set -euo pipefail
          # Found by alias so callers need no repo variables (the role may list distributions).
          IDS=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, '${PREVIEW_ALIAS}')].Id" \
            --output text)
          # Text output prints "None" when the account has no distributions at all.
          [[ "$IDS" == "None" ]] && IDS=""
          read -r -a ID_LIST <<< "$IDS"
          if [[ ${#ID_LIST[@]} -ne 1 ]]; then
            echo "❌ Expected one CloudFront distribution with alias ${PREVIEW_ALIAS}, found ${#ID_LIST[@]}: ${IDS}"
            exit 1
          fi
          echo "✅ Preview distribution: ${ID_LIST[0]}"
          echo "id=${ID_LIST[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload preview to S3
        if: ${{ steps.plan.outputs.mode == 'publish' }}
        env:
          PREFIX: ${{ steps.vars.outputs.prefix }}
        run: |
          set -euo pipefail
          DEST="s3://${BUCKET}/${PREFIX}"
          # Hashed bundles (Vite dist/assets, CRA build/static) get a new name on every
          # change, so browsers may keep them; uploaded before index.html references them.
          # --delete is safe: only this run writes the folder (concurrency group) and the
          # folder holds exactly one build, the PR's current head.
          # Every file is re-uploaded each publish (sync uploads when the local file is newer,
          # and a fresh CI build always is), so no file keeps an old upload date and expires
          # early under the bucket's 14-day rule.
          HASHED_DIRS=(assets static)
          for DIR in "${HASHED_DIRS[@]}"; do
            if [[ -d "${SITE_DIR}/${DIR}" ]]; then
              echo "🚀 Syncing hashed ${DIR}/ to ${DEST}/${DIR}/"
              aws s3 sync "${SITE_DIR}/${DIR}" "${DEST}/${DIR}/" --delete \
                --cache-control "public, max-age=31536000, immutable"
            fi
          done
          echo "🚀 Syncing ${SITE_DIR}/ to ${DEST}/"
          aws s3 sync "${SITE_DIR}" "${DEST}/" --delete \
            --exclude "index.html" --exclude "assets/*" --exclude "static/*"
          echo "📄 Uploading index.html last with no-cache headers"
          aws s3 cp \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            "${SITE_DIR}/index.html" "${DEST}/index.html"

      - name: Remove preview from S3
        if: ${{ steps.plan.outputs.mode == 'remove' }}
        env:
          PREFIX: ${{ steps.vars.outputs.prefix }}
        run: |
          set -euo pipefail
          echo "🗑️  Removing s3://${BUCKET}/${PREFIX}/"
          aws s3 rm "s3://${BUCKET}/${PREFIX}/" --recursive

      - name: Invalidate CloudFront cache
        if: ${{ steps.plan.outputs.mode == 'publish' || steps.plan.outputs.mode == 'remove' }}
        env:
          DISTRIBUTION_ID: ${{ steps.cdn.outputs.id }}
          PREFIX: ${{ steps.vars.outputs.prefix }}
        run: |
          set -euo pipefail
          # Only this PR's prefix, not "/*": the viewer-request function rewrites
          # /<uri> on <app>-pr-<N>.preview... to /<app>/pr-<N><uri> before the cache
          # lookup, so every cached object of this preview has a key under that prefix,
          # and other PRs' previews keep their caches.
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/${PREFIX}/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✅ Invalidation created: $INVALIDATION_ID"

      - name: Update sticky PR comment
        if: ${{ steps.plan.outputs.mode == 'publish' || steps.plan.outputs.mode == 'remove' }}
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TARGET_SHA: ${{ steps.plan.outputs.target_sha }}
          MARKER: ${{ steps.vars.outputs.marker }}
          PREVIEW_URL: ${{ steps.vars.outputs.url }}
        run: |
          set -euo pipefail
          # Written inside the group from this run's decision, which matches what is now in
          # the bucket. One comment per app, found by its hidden marker among this bot's
          # comments and edited in place; serialization means two runs never both create one.
          COMMENT_IDS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id")
          COMMENT_ID="${COMMENT_IDS%%$'\n'*}"
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$MODE" == "publish" ]]; then
            BODY="${MARKER}
          ### 🔍 Preview (${APP_NAME}): ${PREVIEW_URL}

          - **Commit:** \`${TARGET_SHA:0:7}\`
          - **Published:** ${NOW}
          - Talks to the **stage API, stage data**.

          Updated on every push to this PR; removed when it closes."
          else
            if [[ -z "$COMMENT_ID" ]]; then
              echo "ℹ️  No preview comment to update."
              exit 0
            fi
            BODY="${MARKER}
          ### 🗑️ Preview (${APP_NAME}) removed

          This PR is closed, so ${PREVIEW_URL} was deleted on ${NOW}."
          fi
          if [[ -n "$COMMENT_ID" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$BODY" --silent
            echo "✅ Updated comment ${COMMENT_ID}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" --silent
            echo "✅ Posted preview comment"
          fi

      - name: Create preview summary
        if: always()
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TARGET_SHA: ${{ steps.plan.outputs.target_sha }}
          SOURCE_RUN: ${{ steps.plan.outputs.source_run }}
          PREVIEW_URL: ${{ steps.vars.outputs.url }}
          PREFIX: ${{ steps.vars.outputs.prefix }}
          DISTRIBUTION_ID: ${{ steps.cdn.outputs.id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🔍 PR preview ${PREVIEW_ACTION} (${APP_NAME})"
            echo ""
            echo "- **Status:** ${JOB_STATUS}"
            echo "- **PR:** #${PR_NUMBER} (this run's commit ${RUN_SHA})"
            case "$MODE" in
              publish) echo "- **Published:** ${TARGET_SHA} from run ${SOURCE_RUN} at ${PREVIEW_URL} (stage API, stage data)" ;;
              remove) echo "- **Removed:** the PR is closed" ;;
              wait) echo "- **No change:** the PR's head ${TARGET_SHA} isn't built yet; its own run publishes it" ;;
              *) echo "- **No decision made** (failed before planning)" ;;
            esac
            echo "- **S3:** s3://${BUCKET}/${PREFIX}/"
            echo "- **CloudFront:** ${DISTRIBUTION_ID:-not looked up}"
          } >> "$GITHUB_STEP_SUMMARY"
