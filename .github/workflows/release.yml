name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      version_type:
        description: "Version type (major, minor, patch)"
        required: true
        type: string
      staging_branch:
        description: "Staging/development branch name"
        required: false
        type: string
        default: "stage"
      main_branch:
        description: "Production branch name"
        required: false
        type: string
        default: "main"
      package_file:
        description: "Package file path"
        required: false
        type: string
        default: "package.json"
      package_lock:
        description: "Package lock file path"
        required: false
        type: string
        default: "package-lock.json"
      bot_name:
        description: "Git bot name"
        required: false
        type: string
        default: "github-actions[bot]"
      bot_email:
        description: "Git bot email"
        required: false
        type: string
        default: "github-actions[bot]@users.noreply.github.com"

      ai_model:
        description: "GitHub Models model (used when MODELS_TOKEN is provided)"
        type: string
        default: "openai/gpt-4.1-mini"
      jira_base_url:
        description: "Jira site for optional ticket context"
        type: string
        default: "https://servefirst.atlassian.net"
    secrets:
      MODELS_TOKEN:
        description: "Optional GitHub Models read token; absent means title/link fallback"
        required: false
      JIRA_EMAIL:
        description: "Optional read-only Jira service account email"
        required: false
      JIRA_API_TOKEN:
        description: "Optional read-only Jira API token"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.staging_branch }}

      - name: Configure Git
        run: |
          git config user.name "${{ inputs.bot_name }}"
          git config user.email "${{ inputs.bot_email }}"

      - name: Include main history missing from stage
        env:
          MAIN_BRANCH: ${{ inputs.main_branch }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
        run: |
          # Backstop for a release sync that was squashed or never merged: stage then lacks main's
          # history, so the release PR shows old changes and conflicts, and a version bump made on
          # main (a hotfix) is missed. Merge main into this local checkout before the version is
          # read; the release branch is cut from it, and the sync after the release restores stage.
          git fetch --no-tags origin "+refs/heads/$MAIN_BRANCH:refs/remotes/origin/$MAIN_BRANCH"
          if git merge-base --is-ancestor "origin/$MAIN_BRANCH" HEAD; then
            echo "✅ $STAGING_BRANCH contains $MAIN_BRANCH"
            exit 0
          fi
          MISSING=$(git rev-list --count "HEAD..origin/$MAIN_BRANCH")
          if ! git merge --no-ff --no-edit -m "Merge $MAIN_BRANCH into the release: restore $MISSING commit(s) missing from $STAGING_BRANCH" "origin/$MAIN_BRANCH"; then
            git merge --abort
            echo "::error::$STAGING_BRANCH is missing $MISSING commit(s) from $MAIN_BRANCH and they conflict. A lead must merge $MAIN_BRANCH into $STAGING_BRANCH as a merge commit, then run this workflow again."
            exit 1
          fi
          echo "::warning::$STAGING_BRANCH was missing $MISSING commit(s) from $MAIN_BRANCH (a release sync was squashed or never merged). They are merged into this release, and the sync after it restores $STAGING_BRANCH."
          echo "⚠️ \`$STAGING_BRANCH\` was missing $MISSING commit(s) from \`$MAIN_BRANCH\`; they were merged into this release." >> "$GITHUB_STEP_SUMMARY"

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep '"version"' ${{ inputs.package_file }} | sed -E 's/.*"version":\s*"([^"]*)".*/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "📌 Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          VERSION_TYPE="${{ inputs.version_type }}"

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          case $VERSION_TYPE in
            major)
              NEW_VERSION="$((major+1)).0.0"
              ;;
            minor)
              NEW_VERSION="$major.$((minor+1)).0"
              ;;
            patch)
              NEW_VERSION="$major.$minor.$((patch+1))"
              ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🚀 New version will be: $NEW_VERSION"

      - name: Find a closed release that never shipped
        id: closed_release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.new_version.outputs.version }}
          MAIN_BRANCH: ${{ inputs.main_branch }}
        with:
          script: |
            // Closing a release PR to add more work and running this workflow again should start
            // the release over. Only a single closed, unmerged, untagged PR qualifies; anything else
            // (open, merged, tagged, several) is left to the Create Pull Request step's checks.
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const head = `release/${version}`, base = process.env.MAIN_BRANCH;
            const self = `${owner}/${repo}`.toLowerCase();
            const matches = (await github.paginate(github.rest.pulls.list, {
              owner, repo, head: `${owner}:${head}`, base, state: 'all', per_page: 100,
            })).filter(pr => pr.head?.ref === head && pr.base?.ref === base &&
              pr.head?.repo?.full_name?.toLowerCase() === self && pr.base?.repo?.full_name?.toLowerCase() === self);
            if (matches.length !== 1 || matches[0].state !== 'closed' || matches[0].merged_at) return;
            const pr = matches[0];
            for (const tag of [`v${version}`, version]) {
              try {
                await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
                core.info(`Tag ${tag} exists, so v${version} was released; not reopening #${pr.number}`);
                return;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!/^[0-9a-f]{40}$/.test(pr.head?.sha || '')) throw new Error('Closed release PR has no head commit');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('old_head', pr.head.sha);

      - name: Restore the closed release
        id: restore
        if: steps.closed_release.outputs.pr_number != ''
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          PR_NUMBER: ${{ steps.closed_release.outputs.pr_number }}
          OLD_HEAD: ${{ steps.closed_release.outputs.old_head }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
          PACKAGE_FILE: ${{ inputs.package_file }}
          PACKAGE_LOCK: ${{ inputs.package_lock }}
        run: |
          # GitHub reopens a closed PR only while its branch is at, or moved forward from, the PR's
          # last commit. Put the branch back on that commit (keeping anything pushed on top of it),
          # then merge stage in. The PR stays closed here: the Create Pull Request step refreshes its
          # notes and reopens it last, so a failure anywhere before that leaves a closed PR and a
          # rerun simply does this again. This step never moves the branch away from human commits.
          RELEASE_BRANCH="release/$NEW_VERSION"
          SOURCE=$(git rev-parse HEAD) # stage, plus any main history the step above merged in
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/closed-release"
          if [ "$(git rev-parse refs/remotes/origin/closed-release)" != "$OLD_HEAD" ]; then
            echo "::error::#$PR_NUMBER's last commit could not be fetched. Reopen it by hand, then run this workflow again."
            exit 1
          fi
          set +e
          TIP=$(git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH")
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then TIP=${TIP%%[[:space:]]*}; elif [ "$status" -eq 2 ]; then TIP=""; else exit "$status"; fi

          # True when TIP is exactly the version bump an earlier failed run of this workflow made on
          # top of stage: one single-parent commit whose files equal its parent's with the same sed
          # edits the "Update version in package.json" step makes (lines 3 and 9), and nothing else.
          only_a_version_bump() {
            [ "$(git rev-list --count "$SOURCE..$TIP")" = 1 ] || return 1
            [ "$(git rev-list --parents -n 1 "$TIP" | wc -w)" = 2 ] || return 1
            [ "$(git log -1 --format=%s "$TIP")" = "chore: bump version to $NEW_VERSION" ] || return 1
            [ -z "$(git diff --name-only "$TIP^" "$TIP" | grep -vxF -e "$PACKAGE_FILE" -e "$PACKAGE_LOCK")" ] || return 1
            [ -z "$(git diff --summary "$TIP^" "$TIP")" ] || return 1
            local bump='s/"version": "[^"]*"/"version": "'"$NEW_VERSION"'"/'
            git show "$TIP^:$PACKAGE_FILE" | sed "3$bump" | cmp -s - <(git show "$TIP:$PACKAGE_FILE") || return 1
            if git cat-file -e "$TIP^:$PACKAGE_LOCK" 2>/dev/null || git cat-file -e "$TIP:$PACKAGE_LOCK" 2>/dev/null; then
              git show "$TIP^:$PACKAGE_LOCK" | sed -e "3$bump" -e "9$bump" | cmp -s - <(git show "$TIP:$PACKAGE_LOCK") || return 1
            fi
          }

          KEEP="$OLD_HEAD" # the commit the release continues from
          if [ -z "$TIP" ]; then
            git push origin "$OLD_HEAD:refs/heads/$RELEASE_BRANCH"
          elif [ "$TIP" != "$OLD_HEAD" ]; then
            git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH"
            if git merge-base --is-ancestor "$OLD_HEAD" "$TIP"; then
              KEEP="$TIP" # commits pushed after the PR closed stay; GitHub still reopens it
            elif only_a_version_bump; then
              echo "Replacing the version bump an earlier run of this workflow left on $RELEASE_BRANCH"
              git push --force-with-lease="refs/heads/$RELEASE_BRANCH:$TIP" origin "$OLD_HEAD:refs/heads/$RELEASE_BRANCH"
            else
              echo "::error::$RELEASE_BRANCH has commits that are not in #$PR_NUMBER or $STAGING_BRANCH. Nothing was changed: decide what to keep, then reopen #$PR_NUMBER by hand or delete the branch."
              exit 1
            fi
          fi

          git checkout -q --detach "$KEEP"
          if git merge-base --is-ancestor "$SOURCE" HEAD; then
            echo "✅ $RELEASE_BRANCH already has everything on $STAGING_BRANCH"
          elif git merge --no-ff --no-edit -m "Merge $STAGING_BRANCH into $RELEASE_BRANCH" "$SOURCE"; then
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
            echo "✅ Merged $STAGING_BRANCH into $RELEASE_BRANCH"
          else
            git merge --abort
            echo "::error::$STAGING_BRANCH conflicts with $RELEASE_BRANCH. #$PR_NUMBER is still closed. Merge $STAGING_BRANCH into $RELEASE_BRANCH by hand as a merge commit, then run this workflow again."
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        id: release_branch
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          PACKAGE_FILE: ${{ inputs.package_file }}
        run: |
          RELEASE_BRANCH="release/$NEW_VERSION"
          git check-ref-format "refs/heads/$RELEASE_BRANCH"
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH"; then
            git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH"
            git checkout --detach FETCH_HEAD
            node -e 'const fs = require("fs"); const actual = JSON.parse(fs.readFileSync(process.env.PACKAGE_FILE, "utf8")).version; if (actual !== process.env.NEW_VERSION) throw new Error("Existing release branch version mismatch");'
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git checkout -b "$RELEASE_BRANCH"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version in package.json
        if: steps.release_branch.outputs.reused != 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          OLD_VERSION="${{ steps.current_version.outputs.version }}"

          # Update package.json (line 3 is always the version in a standard package.json)
          echo "📝 Updating package.json version..."
          sed -i '3s/"version": "[^"]*"/"version": "'$NEW_VERSION'"/' ${{ inputs.package_file }}

          # Update package-lock.json if it exists
          if [ -f "${{ inputs.package_lock }}" ]; then
            echo "📝 Updating package-lock.json version fields..."
            # Line 3: root version
            sed -i '3s/"version": "[^"]*"/"version": "'$NEW_VERSION'"/' ${{ inputs.package_lock }}
            # Line 9: packages[""] version (in lockfileVersion 2+)
            sed -i '9s/"version": "[^"]*"/"version": "'$NEW_VERSION'"/' ${{ inputs.package_lock }}
          fi

          echo "✅ Updated version to $NEW_VERSION"

      - name: Commit version bump
        if: steps.release_branch.outputs.reused != 'true'
        run: |
          # Add the version files
          git add ${{ inputs.package_file }}

          # Add lock file if it exists
          if [ -f "${{ inputs.package_lock }}" ]; then
            git add ${{ inputs.package_lock }}
          fi

          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }}"
          echo "✅ Committed version bump"

      - name: Push release branch
        if: steps.release_branch.outputs.reused != 'true'
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          git push origin "HEAD:refs/heads/release/$NEW_VERSION"
          echo "✅ Pushed release branch to remote"

      - name: Pin release notes source
        id: notes_source
        env:
          MAIN_BRANCH: ${{ inputs.main_branch }}
        run: |
          printf 'base=%s\n' "$(git rev-parse "refs/remotes/origin/$MAIN_BRANCH^{commit}")" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect and summarize included changes
        id: notes
        uses: servefirstcx/github-workflows/.github/actions/release-notes@main
        with:
          base-sha: ${{ steps.notes_source.outputs.base }}
          head-sha: ${{ steps.notes_source.outputs.head }}
          main-branch: ${{ inputs.main_branch }}
          staging-branch: ${{ inputs.staging_branch }}
          models-token: ${{ secrets.MODELS_TOKEN }}
          ai-model: ${{ inputs.ai_model }}
          jira-base-url: ${{ inputs.jira_base_url }}
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}

      - name: Create Pull Request
        id: create_pr
        uses: actions/github-script@v7
        env:
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
          VERSION: ${{ steps.new_version.outputs.version }}
          MAIN_BRANCH: ${{ inputs.main_branch }}
          REOPEN_PR: ${{ steps.restore.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const head = `release/${version}`, base = process.env.MAIN_BRANCH;
            const sameIdentity = pr => pr.head?.ref === head && pr.base?.ref === base &&
              pr.head?.repo?.full_name?.toLowerCase() === `${owner}/${repo}`.toLowerCase() &&
              pr.base?.repo?.full_name?.toLowerCase() === `${owner}/${repo}`.toLowerCase();
            const findPR = async () => {
              const candidates = await github.paginate(github.rest.pulls.list, {
                owner, repo, head: `${owner}:${head}`, base, state: 'all', per_page: 100,
              });
              const matches = candidates.filter(sameIdentity);
              if (matches.length > 1 || matches.some(pr => pr.state !== 'open')) {
                throw new Error('Ambiguous or closed release PR; manual resolution required');
              }
              return matches[0];
            };
            // A closed release that never shipped was restored by the step above. Refresh its notes
            // while it is still closed (nobody is reviewing it), then reopen it as the last change, so
            // any failure before this point leaves it closed and a rerun starts the restart again.
            const reopen = async number => {
              const start = '<!-- sf-release-notes:start -->', end = '<!-- sf-release-notes:end -->';
              const notes = fs.readFileSync(process.env.NOTES_FILE, 'utf8').trimEnd();
              if (!notes.startsWith(start) || !notes.endsWith(end)) throw new Error('Invalid generated notes');
              const {data: closed} = await github.rest.pulls.get({owner, repo, pull_number: number});
              if (!sameIdentity(closed) || closed.state !== 'closed' || closed.merged_at) throw new Error('Release PR to reopen changed');
              const old = closed.body || '';
              const from = old.indexOf(start), to = from < 0 ? -1 : old.indexOf(end, from);
              const updated = to < 0 ? `${old}\n\n${notes}\n` : old.slice(0, from) + notes + old.slice(to + end.length);
              if (updated.length > 65000) throw new Error('Release notes exceed PR body limit');
              await github.rest.pulls.update({owner, repo, pull_number: number, body: updated});
              try {
                await github.rest.pulls.update({owner, repo, pull_number: number, state: 'open'});
              } catch (error) {
                throw new Error(`GitHub would not reopen #${number} (${error.message}). Reopen it by hand, then run this workflow again.`);
              }
              core.info(`Reopened #${number} with fresh release notes`);
              return notes;
            };
            const reopened = /^[1-9]\d*$/.test(process.env.REOPEN_PR || '') ? await reopen(Number(process.env.REOPEN_PR)) : undefined;
            // Read the reopened PR directly: the PR list can briefly still show it as closed.
            let pr = reopened ? (await github.rest.pulls.get({owner, repo, pull_number: Number(process.env.REOPEN_PR)})).data : await findPR();
            if (reopened && (!sameIdentity(pr) || pr.state !== 'open')) throw new Error('Reopened release PR is not open');
            for (const [name, color] of [['release', '0E8A16'], ['automated', 'EDEDED']]) {
              try { await github.rest.issues.getLabel({owner, repo, name}); }
              catch (error) {
                if (error.status !== 404) throw error;
                try { await github.rest.issues.createLabel({owner, repo, name, color}); }
                catch (race) {
                  if (race.status !== 422) throw race;
                  await github.rest.issues.getLabel({owner, repo, name});
                }
              }
            }
            let body;
            if (reopened) body = reopened;
            if (!pr) {
              const notes = fs.readFileSync(process.env.NOTES_FILE, 'utf8');
              body = `## Release v${version}\n\n${notes}\n\n### Checklist\n- [ ] Tests pass\n- [ ] Ready for production\n`;
              if (body.length > 65000) throw new Error('Release notes exceed PR body limit');
              try {
                ({data: pr} = await github.rest.pulls.create({
                  owner, repo, title: `🚀 Release v${version}`, head, base, body, draft: true,
                }));
              } catch (error) {
                if (error.status !== 422) throw error;
                pr = await findPR();
                if (!pr) throw error;
                body = undefined; // A racing creator's reviewed body belongs to that PR.
              }
            }
            const readPR = async () => {
              const {data: saved} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (!sameIdentity(saved) || saved.state !== 'open') throw new Error('Release PR identity changed');
              // Apps edit a new PR's body within seconds: GitHub for Jira appends ticket link
              // references and Cursor appends a summary. Our body must still be there, intact.
              if (body !== undefined ? !saved.body?.includes(body) :
                  !saved.body?.includes('<!-- sf-release-notes:start -->') || !saved.body?.includes('<!-- sf-release-notes:end -->')) {
                throw new Error('PR body verification failed');
              }
              return saved;
            };
            await readPR();
            await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: ['release', 'automated']});
            const labelled = await readPR();
            if (!labelled.labels.some(label => label.name === 'release')) throw new Error('Release label verification failed');
            if (labelled.draft) {
              await github.graphql(`mutation($id: ID!) {
                markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { id } }
              }`, {id: labelled.node_id});
            }
            const ready = await readPR();
            if (ready.draft || !ready.labels.some(label => label.name === 'release')) throw new Error('Ready release PR verification failed');
            core.setOutput('pr_number', ready.number);
            core.setOutput('pr_url', ready.html_url);

      - name: Summary
        run: |
          echo "## 🚀 Release PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version Information" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Type** | ${{ inputs.version_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **From** | v${{ steps.current_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **To** | v${{ steps.new_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | release/${{ steps.new_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Request" >> $GITHUB_STEP_SUMMARY
          echo "- **PR:** [#${{ steps.create_pr.outputs.pr_number }}](${{ steps.create_pr.outputs.pr_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Open for review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. ⏳ Wait for tests to complete" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Review and approve the PR" >> $GITHUB_STEP_SUMMARY
          echo "3. 🚀 Merge to trigger:" >> $GITHUB_STEP_SUMMARY
          echo "   - Automatic tagging" >> $GITHUB_STEP_SUMMARY
          echo "   - Production deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "[View Pull Request](${{ steps.create_pr.outputs.pr_url }}) →" >> $GITHUB_STEP_SUMMARY
