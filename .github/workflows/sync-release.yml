name: Reusable Sync Release Workflow

# After a release or hotfix is tagged, bring main back into stage as a real merge commit.
# The normal path opens no PR: the workflow merges main into stage itself and pushes it with
# RELEASE_TOKEN, so nobody can pick "Squash and merge" by mistake, and there is no PR whose
# source branch (main) "delete branch on merge" could remove. A PR for a lead is opened only
# when the merge has conflicts, or when it can't be pushed.

on:
  workflow_call:
    inputs:
      staging_branch:
        description: "Staging/development branch name"
        required: false
        type: string
        default: "stage"
      main_branch:
        description: "Production branch name"
        required: false
        type: string
        default: "main"
    secrets:
      RELEASE_TOKEN:
        description: "Token allowed to push to the staging branch (contents + workflows write). Without it a sync PR is opened for a lead to merge"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-stage:
    name: Sync Release Back to Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # git push uses this token. GITHUB_TOKEN cannot push to a protected staging branch.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Syncing release v$VERSION back to $STAGING_BRANCH"
        env:
          STAGING_BRANCH: ${{ inputs.staging_branch }}

      - name: Merge main into stage
        id: sync
        env:
          MAIN_BRANCH: ${{ inputs.main_branch }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retries only cover the staging branch moving between fetch and push.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "+refs/heads/$MAIN_BRANCH:refs/remotes/origin/$MAIN_BRANCH" "+refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
            if git merge-base --is-ancestor "origin/$MAIN_BRANCH" "origin/$STAGING_BRANCH"; then
              echo "✅ $STAGING_BRANCH already contains $MAIN_BRANCH"
              echo "result=in-sync" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo "result=no-token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git checkout -q --detach "origin/$STAGING_BRANCH"
            if ! git merge --no-ff --no-edit -m "🔄 Sync release v$VERSION from $MAIN_BRANCH back to $STAGING_BRANCH" "origin/$MAIN_BRANCH"; then
              git merge --abort
              echo "result=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin "HEAD:refs/heads/$STAGING_BRANCH"; then
              echo "✅ Merged $MAIN_BRANCH into $STAGING_BRANCH as a merge commit ($(git rev-parse --short HEAD))"
              echo "result=merged" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⏳ Push attempt $attempt was rejected; fetching $STAGING_BRANCH again"
            sleep $((attempt * 5))
          done
          echo "result=push-failed" >> "$GITHUB_OUTPUT"

      - name: Open sync PR for a lead
        id: create-pr
        if: contains(fromJSON('["conflict", "no-token", "push-failed"]'), steps.sync.outputs.result)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          MAIN_BRANCH: ${{ inputs.main_branch }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            conflict) REASON="merging \`$MAIN_BRANCH\` into \`$STAGING_BRANCH\` has conflicts" ;;
            no-token) REASON="this repository's sync workflow does not pass \`RELEASE_TOKEN\`, so it cannot push to \`$STAGING_BRANCH\`" ;;
            *) REASON="pushing the merge to \`$STAGING_BRANCH\` was rejected" ;;
          esac
          echo "::warning::Release v$VERSION was not synced back to $STAGING_BRANCH automatically: ${REASON//\`/}. A sync PR is open for a lead."

          gh label create "release-sync" --description "PR to sync release back to staging" --color "0052CC" --force
          gh label create "automated" --description "Automated PR" --color "EDEDED" --force

          {
            echo "## 🔄 Release sync needs a lead"
            echo
            echo "Release v$VERSION was not synced back to \`$STAGING_BRANCH\` automatically: $REASON."
            echo
            echo "**Merge this as a merge commit. Never squash it.** Squashing leaves \`$STAGING_BRANCH\` without \`$MAIN_BRANCH\`'s history, and the next release PR then shows old changes and conflicts."
            echo
            if [ "$RESULT" = "conflict" ]; then
              echo "GitHub's conflict editor can't be used here: it would commit to \`$MAIN_BRANCH\`, which is locked. A lead resolves it locally:"
            else
              echo "A lead can use **Create a merge commit** on this PR, or merge locally:"
            fi
            echo
            echo '```bash'
            echo "git fetch origin"
            echo "git checkout $STAGING_BRANCH && git pull"
            echo "git merge --no-ff origin/$MAIN_BRANCH   # resolve any conflicts, then commit"
            echo "git push origin $STAGING_BRANCH         # leads and admins only"
            echo '```'
            echo
            echo "Pushing the merge closes this PR automatically."
          } > pr_body.md

          EXISTING_PR=$(gh pr list --base "$STAGING_BRANCH" --head "$MAIN_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ Sync PR #$EXISTING_PR is already open"
            echo "PR_NUMBER=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_URL=$(gh pr create \
            --base "$STAGING_BRANCH" \
            --head "$MAIN_BRANCH" \
            --title "🔄 Sync Release v$VERSION back to $STAGING_BRANCH" \
            --body-file pr_body.md \
            --label "release-sync" \
            --label "automated")
          echo "✅ Created PR: $PR_URL"
          echo "PR_NUMBER=${PR_URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Add summary
        env:
          MAIN_BRANCH: ${{ inputs.main_branch }}
          STAGING_BRANCH: ${{ inputs.staging_branch }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          RESULT: ${{ steps.sync.outputs.result }}
          PR_NUMBER: ${{ steps.create-pr.outputs.PR_NUMBER }}
        run: |
          {
            echo "## 🔄 Release Sync Status"
            echo
            case "$RESULT" in
              merged) echo "✅ **Merged automatically.** v$VERSION was merged from \`$MAIN_BRANCH\` into \`$STAGING_BRANCH\` as a merge commit." ;;
              in-sync) echo "ℹ️ \`$STAGING_BRANCH\` already contains \`$MAIN_BRANCH\`. Nothing to sync." ;;
              *)
                echo "⚠️ **A lead needs to merge the sync.** It was not done automatically ($RESULT)."
                if [ -n "$PR_NUMBER" ]; then
                  echo
                  echo "[Sync PR #$PR_NUMBER](https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER): merge it as a merge commit, never squash."
                fi
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
